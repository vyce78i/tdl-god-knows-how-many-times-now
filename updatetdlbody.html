<body>
<!--welcoming page-->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-card">
            <span class="welcome-icon">🌱</span>
            <h1 class="welcome-title">hey, are u ready for the day?</h1>
            <p class="welcome-sub">organize your tasks and make today count.</p>
            <button id="start-app-btn" class="start-app-btn">let's accomplish tasks</button>
        </div>
    </div>

    <!--shows when window is minimized or closed-->
    <div id="restore-dock" class="restore-dock" style="display: none;">
        <button id="reopen-window-btn" class="dock-btn">🌿 Restore Green Productivity</button>
    </div> 

    <!--main app thingy-->
    <div id="window-frame" class="window-frame" style="display: none;">
        <div class="window-header">
            <div class="window-title">
                <div class="window-title-left">
                    <span class="window-title-icon">🌿</span>
                    <span class="window-title-text">Green Productivity</span>
                </div>
            </div> 
        </div>

        <div class="window-content" id="window-content"> <!--the body for the app-->
            <div class="top-row"><!--date and progress (on the left side)-->
                <div class="date-card">
                    <div class="day-name" id="dayname">wednesday</div>
                    <div class="day-circle">
                        <span class="day-circle-text" id="day-circle-text">9</span>
                    </div>
                    <div class="month-name" id="monthname">september</div>
                </div>

                <div class="top-right"><!--already done & adding tasks (on the right side)-->
                    <div class="progress-card">
                        <div class="progress-header">
                            <span class="progress-text">Progress</span>
                            <span id="tasks-completed" class="tasks-completed">0/0</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-bar-fill" id="progress-bar-fill"></div>
                        </div>
                    </div>
                    <div class="task-input">
                        <input type="text" id="task-input-field" placeholder="Add a task..." autocomplete="off">
                        <button id="add-task-btn" class="plus-btn">+</button>
                    </div> 
                </div>
            </div>

            <div class="notes-section">
                <ul id="task-list"><!--will be injected dynamically by JavaScript--></ul>
            </div>

            <div class="bottom-row">
                <button id="finish-day-btn" class="finish-day-btn">finished the day</button>
            </div> 
        </div> 
    </div>

    <!--page 3: notes & transfer remaining tasks-->
    <div id="review-screen" class="window-frame" style="display: none;">
        <div class="window-header">
            <div class="window-title">
                <div class="window-title-left">
                    <span class="window-title-icon">📝</span>
                    <span class="window-title-text">Daily Notes & Review</span>
                </div>
            </div>
        </div>
        <div class="window-content">
            <div class="notes-section" style="min-height: 140px; max-height: 220px;">
                <p style="font-size: 11px; margin-bottom: 8px; color: #242c1c;">Notes on finished tasks:</p>
                <select id="completed-task-select" style="width: 100%; padding: 8px; font-family: inherit; font-size: 10px; background-color: #eee9dc; border: 2px solid #5a6644; border-radius: 8px; color: #242c1c; margin-bottom: 8px; outline: none;"></select>
                <textarea id="daily-notes-field" placeholder="Write any notes about today's accomplishments..." style="width: 100%; height: 90px; background: transparent; border: none; outline: none; font-family: inherit; font-size: 10px; resize: none;"></textarea>
            </div>

            <div class="notes-section" style="min-height: 120px; text-align: center;">
                <p id="transfer-prompt-text" style="font-size: 11px; margin-bottom: 12px; color: #242c1c;">do u want too add these tasks for a new day?</p>
                <div id="remaining-tasks-preview" style="font-size: 10px; margin-bottom: 14px; text-align: left;"></div>
                <div style="display: flex; justify-content: center; gap: 12px;">
                    <button id="transfer-yes-btn" class="finish-day-btn">Yes</button>
                    <button id="transfer-no-btn" class="finish-day-btn">No</button>
                </div>
            </div>
        </div>
    </div>

    <script> 
        //welcome screen and app window elements
        const welcomescreen = document.getElementById('welcome-screen');
        const startAppBtn = document.getElementById('start-app-btn');
        const windowFrame = document.getElementById('window-frame');
        const restoreDock = document.getElementById('restore-dock');
        const reopenWindowBtn = document.getElementById('reopen-window-btn');
        const windowContent = document.getElementById('window-content');
        const reviewScreen = document.getElementById('review-screen');
        const dailyNotesField = document.getElementById('daily-notes-field');
        const completedTaskSelect = document.getElementById('completed-task-select');
        const transferPromptText = document.getElementById('transfer-prompt-text');
        const remainingTasksPreview = document.getElementById('remaining-tasks-preview');
        const transferYesBtn = document.getElementById('transfer-yes-btn');
        const transferNoBtn = document.getElementById('transfer-no-btn');

        //tasks and progress section
        const taskInputField = document.getElementById('task-input-field');
        const addTaskBtn = document.getElementById('add-task-btn');
        const tasklist = document.getElementById('task-list');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const finishDayBtn = document.getElementById('finish-day-btn');
        const tasksCompleted = document.getElementById('tasks-completed');

        //date info
        const dayNameElement = document.getElementById('dayname');
        const dayCircleTextElement = document.getElementById('day-circle-text');
        const monthNameElement = document.getElementById('monthname');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let dayOffset = parseInt(localStorage.getItem('dayOffset')) || 0;

        startAppBtn.addEventListener("click", () => { //welcome screen to app window
            welcomescreen.style.display = "none";
            windowFrame.style.display = "block";
        });

        reopenWindowBtn.addEventListener("click", () => {
            windowFrame.style.display = "block";
            restoreDock.style.display = "none";
            windowContent.style.display = "flex";
        });

        function updateDate() { //for setting the date automatically
            const now = new Date();
            now.setDate(now.getDate() + dayOffset);
            const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const monthNames = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
            dayNameElement.textContent = dayNames[now.getDay()];
            dayCircleTextElement.textContent = now.getDate();
            monthNameElement.textContent = monthNames[now.getMonth()];
        }

        function renderTasks() { //for rendering the tasks dynamically
            tasklist.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} data-index="${index}">
                    <span class="task-text ${task.completed ? 'completed' : ''}">${escapeHtml(task.text)}</span>
                    <button class="delete-task-btn" data-index="${index}">🗑️</button>
                `;
                tasklist.appendChild(li); 
            }); 
            updateProgress();
        }

        function updateProgress() { //for updating the progress section 
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(task => task.completed).length;
            const progressPercentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            if (progressBarFill) progressBarFill.style.width = `${progressPercentage}%`;
            if (tasksCompleted) tasksCompleted.textContent = `${completedTasks}/${totalTasks}`;
        } 

        function toggleTaskCompletion(index) { //for toggling the completion of a task
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
            updateProgress();
        } 

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
            updateProgress();
        }

        function saveTasks() { //for saving tasks to local storage
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function addTask() { //for adding a task
            const taskText = taskInputField.value.trim();
            if (taskText) {
                tasks.push({ text: taskText, completed: false });
                saveTasks();
                taskInputField.value = '';
                renderTasks();
                updateProgress();
            }
        }

        function escapeHtml(text) { //for escaping html injection(characters)
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        addTaskBtn.addEventListener("click", addTask);

        taskInputField.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                addTask();
            }
        });

        // Event delegation for checkbox toggles and delete buttons
        tasklist.addEventListener("click", (e) => {
            const index = e.target.dataset.index;
            if (index === undefined) return;

            if (e.target.classList.contains("task-checkbox")) {
                toggleTaskCompletion(index);
            } else if (e.target.classList.contains("delete-task-btn")) {
                deleteTask(index);
            }
        });

        // Finished day: opens review & transfer page
        finishDayBtn.addEventListener("click", () => {
            const completed = tasks.filter(t => t.completed);
            const remaining = tasks.filter(t => !t.completed);

            // Populate Completed Task Selector for Notes
            completedTaskSelect.innerHTML = '';
            if (completed.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = "No completed tasks to add notes to";
                completedTaskSelect.appendChild(opt);
                completedTaskSelect.disabled = true;
                dailyNotesField.disabled = true;
            } else {
                completedTaskSelect.disabled = false;
                dailyNotesField.disabled = false;
                completed.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.text;
                    opt.textContent = t.text;
                    completedTaskSelect.appendChild(opt);
                });
            }

            remainingTasksPreview.innerHTML = '';

            if (remaining.length === 0) {
                transferPromptText.textContent = "All tasks completed! Ready for the new day?";
                transferNoBtn.style.display = "none";
                transferYesBtn.textContent = "Start Next Day";
            } else {
                transferPromptText.textContent = "do u want too add these tasks for a new day?";
                transferNoBtn.style.display = "inline-block";
                transferYesBtn.textContent = "Yes";
                remaining.forEach(t => {
                    const item = document.createElement('div');
                    item.textContent = `• ${t.text}`;
                    remainingTasksPreview.appendChild(item);
                });
            }

            windowFrame.style.display = "none";
            reviewScreen.style.display = "block";
        });

        function handleTransferDecision(keepRemaining) {
            const notes = dailyNotesField.value.trim();
            const selectedTask = completedTaskSelect.value;
            if (notes && !completedTaskSelect.disabled) {
                const storedNotes = JSON.parse(localStorage.getItem('saved_task_notes')) || [];
                storedNotes.push({ task: selectedTask, note: notes, date: new Date().toLocaleDateString() });
                localStorage.setItem('saved_task_notes', JSON.stringify(storedNotes));
                dailyNotesField.value = '';
            }

            // Advances to the next day (e.g. today -> Sunday)
            dayOffset += 1;
            localStorage.setItem('dayOffset', dayOffset);
            updateDate();

            if (keepRemaining) {
                tasks = tasks.filter(t => !t.completed);
            } else {
                tasks = [];
            }

            saveTasks();
            renderTasks();
            updateProgress();

            reviewScreen.style.display = "none";
            windowFrame.style.display = "block";
        }

        transferYesBtn.addEventListener("click", () => handleTransferDecision(true));
        transferNoBtn.addEventListener("click", () => handleTransferDecision(false));

        updateDate();
        renderTasks();
        updateProgress();
    </script>
